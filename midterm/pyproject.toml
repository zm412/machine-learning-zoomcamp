[project]
name = "candidate-fit-predictor"
version = "0.1.0"
description = "ML inference API for predicting candidate hiring fit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "gunicorn>=27.0.1",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
midterm = "midterm:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
